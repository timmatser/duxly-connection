# Shopify App Configuration for: Duxly Connection Acelera
# Created 2026-05-29 for Acelera (performance cycling apparel — acelera.cc)
#
# Project: IT architecture discovery — returns, orders & refunds.
# Scopes below are scoped to THIS project's needs (returns-first architecture):
#   read_orders/write_orders ........... order data + refund actions
#   read_all_orders .................... orders older than 60 days. PROTECTED scope,
#       granted by Shopify 2026-08-28. Without it the Admin API serves only the last
#       60 days on EVERY path (search, order(id:), orderByIdentifier) — measured, and
#       it stranded 16 of 1016 refunds on needs_review:order_outside_api_window.
#   read_returns/write_returns ......... Returns API — core of the project (return requests, return-label flow)
#   read_fulfillments/write_fulfillments  fulfillment + tracking
#   *_assigned_fulfillment_orders ...... fulfillment-order lifecycle
#   *_merchant_managed_fulfillment_orders  merchant-managed FO
#   *_third_party_fulfillment_orders ... Picqer/Packfeed is a third-party fulfillment service
#   read_products ...................... line-item / SKU context
#   read_customers ..................... customer-level return/refund matching
#   read_locations ..................... warehouse / return-destination locations
#   read_shipping ...................... shipping + label context
#
# Trim later once the Phase 1 design is locked; start with what the returns/refund
# work actually touches. Bol.com returns are out of scope; this app is the Shopify channel.

# App Identity
name = "Duxly Connection Acelera"
# client_id is minted when the app registration is created (Shopify Partner dashboard
# → Duxly Connection Admin). Replace the placeholder below before `shopify app config link`.
client_id = "e06cb96344fef3cbf351544423e6682b"
handle = "duxly-connection-acelera"

# App URLs
application_url = "https://d23dbydr2m94fv.cloudfront.net/?client_id=e06cb96344fef3cbf351544423e6682b"
embedded = true

# Access Scopes
[access_scopes]
scopes = "read_orders,write_orders,read_all_orders,read_returns,write_returns,read_fulfillments,write_fulfillments,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders,write_third_party_fulfillment_orders,read_products,read_customers,read_locations,read_shipping"
use_legacy_install_flow = false

# Authentication
[auth]
redirect_urls = [
    "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/callback"
]

# Webhooks Configuration
[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks"

# GDPR Compliance Webhooks
[webhooks.privacy_compliance]
customer_data_request_url = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks/gdpr/customers_data_request"
customer_deletion_url = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks/gdpr/customers_redact"
shop_deletion_url = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks/gdpr/shop_redact"

# Build Settings (for local development)
[build]
automatically_update_urls_on_dev = true
