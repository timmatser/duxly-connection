# Shopify App Configuration for: Duxly Connection (Public App)
# Generated by Duxly Connection Admin

# App Identity
name = "Duxly Connection"
client_id = "79f672bb13bc6ab7fa86755927ff9a6f"
handle = "duxly-connection"

# App URLs
application_url = "https://d23dbydr2m94fv.cloudfront.net/?client_id=79f672bb13bc6ab7fa86755927ff9a6f"
embedded = true

# Access Scopes
# 2026-07-06: extended with inventory-transfer/shipment/draft-order/order/
# fulfillment/customer/location/inventory scopes so the master demo app can
# serve as the token source for the hartbeach-transfers-and-orders bridge's
# dev pair (duxlydemo + quickstart-af2e1cfa). This app is installed on Duxly
# demo stores only. NOTE: this app uses Shopify-managed installation, so the
# scopes declared HERE are what gets granted — the per-app scopes SSM param
# (/shopify/duxly-connection/apps/duxly-connection/scopes) only shapes the
# OAuth request URL and is overridden by this list.
[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_customers,write_customers,read_translations,write_translations,read_locales,read_inventory,write_inventory,read_locations,write_locations,write_inventory_transfers,write_inventory_shipments,write_inventory_shipments_received_items,write_draft_orders,write_merchant_managed_fulfillment_orders,write_assigned_fulfillment_orders"
use_legacy_install_flow = false

# Authentication
[auth]
redirect_urls = [
    "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/callback"
]

# Webhooks Configuration
[webhooks]
api_version = "2024-01"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks"

# GDPR Compliance Webhooks
[webhooks.privacy_compliance]
customer_data_request_url = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks/gdpr/customers_data_request"
customer_deletion_url = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks/gdpr/customers_redact"
shop_deletion_url = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks/gdpr/shop_redact"

# Build Settings (for local development)
[build]
automatically_update_urls_on_dev = true
