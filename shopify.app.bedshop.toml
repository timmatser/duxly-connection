client_id = "ffa09d6e61d65e7ba68dabdf031e1ba2"
name = "Duxly Connection Bedshop"
application_url = "https://d23dbydr2m94fv.cloudfront.net/?client_id=ffa09d6e61d65e7ba68dabdf031e1ba2"
embedded = true
handle = "duxly-connection-bedshop"

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks/gdpr/customers_data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks/gdpr/customers_redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks/gdpr/shop_redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/webhooks"

[access_scopes]
# Bedshop: Lightspeed -> Shopify product sync (bedshop repo, shopify/). Orders read for phase 2.
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_publications,write_publications,read_files,write_files,read_translations,write_translations,read_locales,write_locales,read_online_store_navigation,write_online_store_navigation,read_orders,read_customers,read_content,write_content,read_legal_policies,write_legal_policies,read_markets,write_markets,read_themes,read_shipping,write_shipping"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://lf3gyfp569.execute-api.eu-central-1.amazonaws.com/prod/callback"
]
